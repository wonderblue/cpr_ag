name: Daily NSE CPR Scan & Auto-Deploy

on:
  schedule:
    # 4:00 PM IST (10:30 AM UTC) Mon-Fri after market close
    - cron: '30 10 * * 1-5'
    # 8:45 AM IST (3:15 AM UTC) Mon-Fri pre-market
    - cron: '15 3 * * 1-5'
  workflow_dispatch: # Allows 1-click manual execution anytime

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Libraries
        run: |
          pip install yfinance pandas numpy

      - name: Run CPR Calculation Engine
        run: |
          python scripts/fetch_and_build.py

      - name: Commit & Push Updated Screener Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener_output.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Market EOD CPR Update [skip ci]" && git push)

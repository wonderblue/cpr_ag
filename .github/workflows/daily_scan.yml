name: Daily NSE CPR Scan & Publish

on:
  schedule:
    # 4:00 PM IST (10:30 AM UTC) Mon-Fri - EOD Scan
    - cron: '30 10 * * 1-5'
    # 8:45 AM IST (3:15 AM UTC) Mon-Fri - Pre-Market Scan
    - cron: '15 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Institutional CPR & Quant Screener Engine
        run: |
          python scripts/fetch_and_build.py

      - name: Commit and Push Fresh Screener Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener_output.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update NSE CPR data [skip ci]" && git push)
